version: 2

# Majors are deliberate upgrades (Node base image, TypeScript, action APIs):
# they get their own branch and QA, never a bot PR. Dependabot only keeps the
# pins fresh within the current major.
updates:
  # Actions are pinned to commit SHAs, so this is the only thing that moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # One pnpm workspace, one lockfile at the root: this entry covers apps/api and
  # apps/mobile too.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      workspace-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
