name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time: concurrent runs would race on the VPS, and the digest
# check would then fail for the run that lost the race.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    # workflow_run fires for any run of CI, including one a fork started on its own
    # branch called main. Deploy only for a push to main in this repository.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: read
      packages: write

    steps:
      # workflow_run checks out the default branch HEAD by default, which is not
      # necessarily the commit CI validated. Pin it to the tested commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quedamos-api:latest

      # The deploy used to stay green when the pull failed (a stale ghcr login on the
      # VPS kept the old container running for months). Now every step fails loudly:
      # the pull must succeed, the container must run the image we just pushed, and
      # /health must answer with Firebase initialised before the job goes green.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXPECTED_DIGEST
          script: |
            set -euo pipefail
            cd /opt/services
            docker logout ghcr.io || true
            docker compose pull quedamos-api
            docker compose up -d quedamos-api
            running=$(docker inspect quedamos-api --format '{{.Image}}')
            latest=$(docker image inspect ghcr.io/alvarotorresc/quedamos-api:latest --format '{{.Id}}')
            if [ "$running" != "$latest" ]; then
              echo "container runs $running but latest image is $latest"; exit 1
            fi
            pushed=$(docker image inspect ghcr.io/alvarotorresc/quedamos-api:latest --format '{{join .RepoDigests ","}}')
            case "$pushed" in
              *"$EXPECTED_DIGEST"*) echo "running the image pushed by this run ($EXPECTED_DIGEST)";;
              *) echo "latest on the VPS ($pushed) is not the image pushed by this run ($EXPECTED_DIGEST)"; exit 1;;
            esac

      - name: Verify /health
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS -m 10 https://quedamos.api.alvarotc.com/health || true)
            echo "attempt $i: ${body:-no response}"
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"firebaseInitialized":true'; then
              exit 0
            fi
            sleep 6
          done
          echo "the API did not report a healthy, Firebase-initialised state within 2 minutes"
          exit 1
