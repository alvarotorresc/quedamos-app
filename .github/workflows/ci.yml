name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded pull request runs, but let a run on main finish: Deploy API
# keys off its conclusion, and a cancelled run would silently skip the deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @quedamos/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Backend tests
        run: pnpm --filter @quedamos/api test

      - name: Frontend tests
        run: pnpm --filter @quedamos/mobile test

      - name: Build API
        run: pnpm --filter @quedamos/api exec nest build

      - name: Build Mobile
        run: pnpm --filter @quedamos/mobile build
